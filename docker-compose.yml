# glance on a vps: `docker compose up -d --build`. caddy answers on 80 and 443 for GLANCE_DOMAIN
# (point its dns here first) and forwards /api/ to glance, which isn't reachable from outside
services:
  glance:
    build:
      context: .
      target: server
      # the versions this release was tested with: bump on purpose (docs/operations.md)
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.309}
        CODEX_VERSION: ${CODEX_VERSION:-0.163.0}
    restart: unless-stopped
    # the agent clis start processes of their own: an init reaps them
    init: true
    env_file: .env
    # what the setup depends on: not overridable from .env
    environment:
      GLANCE_ENV: production
      BETTER_AUTH_URL: https://${GLANCE_DOMAIN:?set GLANCE_DOMAIN in .env}
      HOST: 0.0.0.0
      PORT: "7420"
      DATABASE_URL: postgres://glance:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/glance
      GLANCE_CHECKOUTS: /data/checkouts
      CODEX_HOME: /data/codex
      GLANCE_LOG_FORMAT: json
      GLANCE_TRUST_PROXY: "true"
    volumes:
      - glance-data:/data
    # glance migrates the database when it starts: it needs postgres up first
    depends_on:
      postgres:
        condition: service_healthy
    # a stop leaves running reviews to the next start, which takes them up again
    stop_grace_period: 30s
    # the agents read untrusted code and can be greedy: they get this much of the machine, no more.
    # AGENT_CONCURRENCY agents run at once, each a few hundred MB
    deploy:
      resources:
        limits:
          cpus: "${GLANCE_CPUS:-2}"
          memory: ${GLANCE_MEMORY:-4g}
          pids: 1024
    logging: &logs
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  # reachable only from glance, on the compose network
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: glance
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glance -d glance"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *logs

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      GLANCE_DOMAIN: ${GLANCE_DOMAIN:?set GLANCE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - glance
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    logging: *logs

volumes:
  glance-data:
  postgres-data:
  caddy-data:
  caddy-config:

# typecheck, lint, formatting, tests and both images on every pull request and on main. a v* tag
# (git tag v0.2.0 && git push origin v0.2.0) also publishes the images to ghcr.io for amd64 and arm64
# and makes a github release with the docker-compose.yml that runs them
name: check

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun test
      - run: bun run build

  images:
    runs-on: ubuntu-24.04
    # a release publishes only what passed the checks
    needs: check
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      # arm64 on an amd64 runner: only the images' last stages (apk, copying files) are emulated
      - uses: docker/setup-qemu-action@v3
        if: env.RELEASE == 'true'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3: 1.2.3, 1.2 and latest. a pre-release (v1.3.0-rc.1) gets its own tag only, never latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mekiki-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: org.opencontainers.image.title=mekiki-${{ matrix.target }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.RELEASE == 'true' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the release's docker-compose.yml runs its own version unless MEKIKI_VERSION says otherwise
      - run: |
          mkdir release
          sed 's/${MEKIKI_VERSION:-latest}/${MEKIKI_VERSION:-'"${GITHUB_REF_NAME#v}"'}/' docker-compose.yml > release/docker-compose.yml
          grep -q "MEKIKI_VERSION:-${GITHUB_REF_NAME#v}}" release/docker-compose.yml
          # github drops an asset name's leading dot
          cp .env.example release/env.example
          cp scripts/backup.sh scripts/restore-check.sh release/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
